<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated Posters - Poster Generation Module</title>

    <!-- Link to Design System -->
    <link rel="stylesheet" href="../design-system/base.css">
    <link rel="stylesheet" href="../design-system/typography.css">

    <style>
        body {
            background: var(--color-bg-primary);
            color: var(--color-text-primary);
            min-height: 100vh;
            padding: var(--space-8);
        }

        .page-header {
            margin-bottom: var(--space-8);
        }

        .page-title {
            margin-bottom: var(--space-4);
        }

        .stats-bar {
            display: flex;
            gap: var(--space-6);
            padding: var(--space-4);
            background: var(--color-bg-secondary);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-6);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--color-text-secondary);
            margin-bottom: var(--space-1);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .posters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--space-6);
        }

        .poster-card {
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border-primary);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .poster-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .poster-preview {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: var(--color-bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .poster-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .poster-preview-placeholder {
            color: var(--color-text-tertiary);
            text-align: center;
            padding: var(--space-4);
        }

        .poster-info {
            padding: var(--space-4);
        }

        .poster-title {
            font-weight: 600;
            margin-bottom: var(--space-2);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .poster-metadata {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
            font-size: 0.875rem;
            color: var(--color-text-secondary);
        }

        .metadata-item {
            display: flex;
            justify-content: space-between;
        }

        .metadata-label {
            font-weight: 500;
        }

        .poster-actions {
            display: flex;
            gap: var(--space-2);
        }

        .btn {
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            flex: 1;
            min-height: 44px;
            /* iOS touch target minimum */
            min-width: 44px;
            /* Ensure square-ish for small buttons */
        }

        .btn-primary {
            background: var(--color-primary);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--color-bg-tertiary);
            color: var(--color-text-primary);
            border: 1px solid var(--color-border-primary);
        }

        .btn-secondary:hover {
            background: var(--color-bg-secondary);
        }

        .btn-danger {
            background: var(--color-error);
            color: white;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: var(--space-12);
            color: var(--color-text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: var(--space-4);
        }

        .accessible-badge {
            display: inline-block;
            padding: var(--space-1) var(--space-2);
            background: var(--color-success);
            color: white;
            font-size: 0.75rem;
            border-radius: var(--radius-sm);
            margin-left: var(--space-2);
        }
    </style>
</head>

<body>
    <div class="page-header">
        <h1 class="page-title">Generated Posters</h1>
        <p>View, download, and regenerate your posters</p>
    </div>

    <div id="statsBar" class="stats-bar">
        <div class="stat-item">
            <span class="stat-label">Total Posters</span>
            <span class="stat-value" id="statTotal">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Storage Used</span>
            <span class="stat-value" id="statStorage">0 KB</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Token Version</span>
            <span class="stat-value" id="statVersion">1.0.0</span>
        </div>
    </div>

    <div id="postersGrid" class="posters-grid">
        <!-- Posters will be inserted here -->
    </div>

    <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-state-icon">📋</div>
        <h2>No Posters Yet</h2>
        <p>Create your first poster to see it here</p>
    </div>

    <!-- Scripts -->
    <script src="poster_storage.js"></script>
    <script src="poster_renderer.js"></script>
    <script src="content_mapper.js"></script>
    <script src="poster_rules.js"></script>

    <script>
        // Initialize storage
        const storage = new PosterStorage();

        /**
         * Load and display all posters
         */
        function loadPosters() {
            const posters = storage.getAllPosters();
            const grid = document.getElementById('postersGrid');
            const emptyState = document.getElementById('emptyState');

            // Update stats
            updateStats();

            // Show empty state if no posters
            if (posters.length === 0) {
                grid.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            emptyState.style.display = 'none';

            // Clear grid
            grid.innerHTML = '';

            // Render each poster card
            posters.forEach(poster => {
                const card = createPosterCard(poster);
                grid.appendChild(card);
            });
        }

        /**
         * Escape HTML entities for safe text interpolation.
         */
        function escapeHTML(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /**
         * Create poster card element
         */
        function createPosterCard(poster) {
            const card = document.createElement('div');
            card.className = 'poster-card';
            card.dataset.posterId = poster.poster_id;
            const metadata = poster.metadata || {};
            const title = metadata.title || poster.event_data?.title || 'Untitled Poster';
            const escapedTitle = escapeHTML(title);
            const escapedTemplateId = escapeHTML(poster.template_id || 'unknown');
            const escapedEventDate = escapeHTML(metadata.date || 'N/A');
            const escapedTokenVersion = escapeHTML(poster.token_version || 'N/A');
            const escapedPosterId = escapeHTML(poster.poster_id || 'N/A');
            const escapedPosterIdAttr = String(poster.poster_id || '').replace(/'/g, "\\'");

            // Format date
            const generatedDate = new Date(poster.generated_at);
            const formattedDate = generatedDate.toLocaleDateString();
            const formattedTime = generatedDate.toLocaleTimeString();
            const escapedGenerated = escapeHTML(`${formattedDate} ${formattedTime}`);

            // Accessibility badge
            const accessibleBadge = metadata.accessible
                ? '<span class="accessible-badge">WCAG AA ✓</span>'
                : '';

            card.innerHTML = `
        <div class="poster-preview">
          ${poster.export_data_url
                    ? `<img src="${poster.export_data_url}" alt="${escapedTitle}">`
                    : `<div class="poster-preview-placeholder">
                 <p>No preview available</p>
                 <p><small>Regenerate to create preview</small></p>
               </div>`
                }
        </div>
        
        <div class="poster-info">
          <h3 class="poster-title">${escapedTitle}${accessibleBadge}</h3>
          
          <div class="poster-metadata">
            <div class="metadata-item">
              <span class="metadata-label">Template:</span>
              <span>${escapedTemplateId}</span>
            </div>
            <div class="metadata-item">
              <span class="metadata-label">Generated:</span>
              <span>${escapedGenerated}</span>
            </div>
            <div class="metadata-item">
              <span class="metadata-label">Event Date:</span>
              <span>${escapedEventDate}</span>
            </div>
            <div class="metadata-item">
              <span class="metadata-label">Token Version:</span>
              <span>${escapedTokenVersion}</span>
            </div>
            <div class="metadata-item">
              <span class="metadata-label">Poster ID:</span>
              <span><small>${escapedPosterId}</small></span>
            </div>
          </div>
          
          <div class="poster-actions">
            <button class="btn btn-primary" onclick="downloadPoster('${escapedPosterIdAttr}')">
              Download
            </button>
            <button class="btn btn-secondary" onclick="regeneratePoster('${escapedPosterIdAttr}')">
              Regenerate
            </button>
            <button class="btn btn-danger" onclick="deletePoster('${escapedPosterIdAttr}')">
              Delete
            </button>
          </div>
        </div>
      `;

            return card;
        }

        /**
         * Update statistics bar
         */
        function updateStats() {
            const stats = storage.getStats();

            document.getElementById('statTotal').textContent = stats.totalPosters;
            document.getElementById('statStorage').textContent = stats.storageSizeKB + ' KB';
            document.getElementById('statVersion').textContent = stats.tokenVersion;
        }

        /**
         * Download poster
         */
        async function downloadPoster(posterId) {
            const poster = storage.getPosterById(posterId);
            if (!poster) {
                alert('Poster not found');
                return;
            }

            // If export data URL exists, download it
            if (poster.export_data_url) {
                const link = document.createElement('a');
                link.href = poster.export_data_url;
                const safeTitle = (poster.metadata?.title || poster.event_data?.title || 'poster')
                    .replace(/\s+/g, '-')
                    .replace(/[^\w-]+/g, '-')
                    .replace(/-+/g, '-')
                    .replace(/^-|-$/g, '')
                    .toLowerCase() || 'poster';
                link.download = `${safeTitle}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                console.log('Downloaded poster:', posterId);
            } else {
                alert('No export available. Please regenerate the poster first.');
            }
        }

        /**
         * Regenerate poster
         */
        async function regeneratePoster(posterId) {
            const poster = storage.getPosterById(posterId);
            if (!poster) {
                alert('Poster not found');
                return;
            }

            // Note: In a real implementation, this would:
            // 1. Load the template
            // 2. Inject render-safe content
            // 3. Render to canvas
            // 4. Update export data URL

            const title = poster.metadata?.title || poster.event_data?.title || 'Untitled Poster';
            alert(`Regeneration functionality requires template rendering integration.\n\nPoster: ${title}\nTemplate: ${poster.template_id}\n\nThis would re-render the poster with current design tokens and update the preview.`);

            console.log('Regenerate poster:', posterId);
            console.log('Event data:', poster.event_data);
            console.log('Render-safe content:', poster.render_safe_content);
        }

        /**
         * Delete poster
         */
        function deletePoster(posterId) {
            const poster = storage.getPosterById(posterId);
            if (!poster) {
                alert('Poster not found');
                return;
            }

            const title = poster.metadata?.title || poster.event_data?.title || 'Untitled Poster';
            if (confirm(`Delete poster "${title}"?`)) {
                storage.deletePoster(posterId);
                loadPosters();
                console.log('Deleted poster:', posterId);
            }
        }

        // Load posters on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadPosters();
        });
    </script>
</body>

</html>
