<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Preview - Modular System</title>

    <!-- Design system -->
    <link rel="stylesheet" href="../design-system/base.css">
    <link rel="stylesheet" href="../design-system/typography.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle at 20% 20%, #eef2ff, #f8fafc 45%);
            padding: 2rem;
            color: #0f172a;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 2rem;
            color: #333;
        }

        .controls {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            margin-bottom: 2rem;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
            border: 1px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #555;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            background: linear-gradient(120deg, #6366f1, #7c3aed);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 999px;
            font-size: 1rem;
            cursor: pointer;
            margin-right: 0.5rem;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
            transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 36px rgba(99, 102, 241, 0.42);
            opacity: 0.95;
        }

        .preview-section {
            background: white;
            padding: 2rem;
            border-radius: 18px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.14);
            border: 1px solid #e2e8f0;
        }

        #poster-preview {
            min-height: 440px;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            background: linear-gradient(180deg, #ffffff, #f8fafc);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
            padding: 16px;
            overflow: auto;
        }

        #poster-preview:empty::before {
            content: 'Preview will appear here...';
        }

        /* Keep poster scaled and centered on smaller screens */
        #poster-preview .poster-container {
            width: min(800px, 100%);
            height: auto;
            aspect-ratio: 2 / 3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Poster Preview - Modular System</h1>

        <div class="controls">
            <h2>Event Details</h2>

            <div class="form-group">
                <label for="event-title">Event Title</label>
                <input type="text" id="event-title" placeholder="Enter event title">
            </div>

            <div class="form-group">
                <label for="event-description">Description</label>
                <textarea id="event-description" placeholder="Enter event description"></textarea>
            </div>

            <div class="form-group">
                <label for="event-date">Date</label>
                <input type="text" id="event-date" placeholder="e.g., March 15, 2026">
            </div>

            <div class="form-group">
                <label for="event-time">Time</label>
                <input type="text" id="event-time" placeholder="e.g., 6:00 PM - 9:00 PM">
            </div>

            <div class="form-group">
                <label for="event-location">Location</label>
                <input type="text" id="event-location" placeholder="e.g., Convention Center, Hall A">
            </div>

            <div class="form-group">
                <label for="event-category">Category</label>
                <input type="text" id="event-category" placeholder="e.g., Technology">
            </div>

            <div class="form-group">
                <label for="template-select">Template</label>
                <select id="template-select">
                    <option value="">-- Select Template --</option>
                    <option value="modern">Modern</option>
                    <option value="minimal" disabled>Minimal (coming soon)</option>
                    <option value="vibrant" disabled>Vibrant (coming soon)</option>
                </select>
            </div>

            <button id="export-btn">Export PNG</button>
        </div>

        <div class="preview-section">
            <h2>Preview</h2>
            <div id="poster-preview"></div>
        </div>
    </div>

    <!-- Core Module Scripts -->
    <script src="js/core/state.js"></script>
    <script src="js/core/template_engine.js"></script>
    <script src="content_mapper.js"></script>
    <script src="poster_rules.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="poster_renderer.js"></script>

    <!-- Application Orchestration -->
    <script src="js/core/app.js"></script>

    <!-- Initialize Application -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 DOM loaded, initializing app...');

            // Initialize the application
            initializeApp();

            // Wire up form inputs to state
            const titleInput = document.getElementById('event-title');
            const descInput = document.getElementById('event-description');
            const dateInput = document.getElementById('event-date');
            const timeInput = document.getElementById('event-time');
            const locationInput = document.getElementById('event-location');
            const categoryInput = document.getElementById('event-category');
            const templateSelect = document.getElementById('template-select');

            // Update state when inputs change
            titleInput.addEventListener('input', (e) => {
                stateManager.setEventField('title', e.target.value);
            });

            descInput.addEventListener('input', (e) => {
                stateManager.setEventField('description', e.target.value);
            });

            dateInput.addEventListener('input', (e) => {
                stateManager.setEventField('date', e.target.value);
            });

            timeInput.addEventListener('input', (e) => {
                stateManager.setEventField('time', e.target.value);
            });

            locationInput.addEventListener('input', (e) => {
                stateManager.setEventField('location', e.target.value);
            });

            categoryInput.addEventListener('input', (e) => {
                stateManager.setEventField('category', e.target.value);
            });

            templateSelect.addEventListener('change', (e) => {
                if (e.target.value) {
                    stateManager.setSelectedTemplate(e.target.value);
                }
            });

            // Default to the migrated template.
            templateSelect.value = 'modern';
            stateManager.setSelectedTemplate('modern');

            console.log('✅ App initialized and form handlers attached');
        });
    </script>
</body>

</html>
