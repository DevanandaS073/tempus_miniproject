<!DOCTYPE html>
<html>

<head>
    <title>Poster Test</title>
</head>

<body>
    <h1>Poster Generator</h1>
    <div id="poster-preview"></div>

    <!-- Load modules -->
    <script src="validator.js"></script>
    <script src="content_mapper.js"></script>
    <script src="js/core/template_engine.js"></script>

    <script>
        async function generatePoster() {
            // Your event data
            const eventData = {
                title: "Tech Conference 2026",
                subtitle: "Innovation and Ideas",
                description: "Join us for an amazing day of learning and networking with industry leaders",
                date: "March 15, 2026",
                time: "10:00 AM - 6:00 PM",
                location: "Convention Center",
                theme: "ocean"
            };

            // Step 1: Validate
            const validator = new PosterValidator();
            const validation = validator.validateForRendering(eventData);
            if (!validation.isValid) {
                alert('Validation failed: ' + validation.errors[0].message);
                return;
            }

            // Step 2: Map content
            const mapper = new ContentMapper();
            const content = mapper.mapContent(eventData);

            // Step 3: Load template
            const engine = new TemplateEngine();
            // Ensure base paths are correct relative to this file
            engine.setBasePath('schemas', './templates/');
            engine.setBasePath('html', './templates/');

            let template;
            try {
                template = await engine.loadTemplate('modern');
            } catch (e) {
                console.error("Failed to load template:", e);
                return;
            }

            // Step 4: Render
            const container = document.querySelector('#poster-preview');
            container.innerHTML = template.html;
            engine.render(container, content, template.schema);
        }

        // Generate on page load
        generatePoster();
    </script>
</body>

</html>
